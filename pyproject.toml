[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geotrack"
version = "1.0.0"
description = "Live device tracking with per-user circular geozones and alerts"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.156.8",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "geoalchemy2==0.20.0",
    "alembic==1.20.0",
    "redis==8.1.0",
]

[project.optional-dependencies]
generator = ["httpx==0.28.1"]
dev = [
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fakeredis==2.40.0",
    "black==24.10.0",
    "flake8==7.4.1",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geotrack"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
    "fakeredis",
    "fakeredis.*",
    "geoalchemy2",
    "geoalchemy2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs the PostGIS database from docker compose"]
filterwarnings = ["error::DeprecationWarning:geotrack.*"]
